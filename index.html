        <div class="intro-layout">
          <article class="intro-story">

    <section class="login-stage has-account-picker" id="login-screen" aria-label="PP 登录界面" hidden>
      <button class="back-button" id="back-to-intro"><svg class="icon"><use href="#back"/></svg> 返回开场</button>
      <div class="login-card">
        <div class="login-halo" aria-hidden="true"></div>
        <header class="login-topbar"><span class="pp-logo"><svg class="pp-mark"><use href="#pp-mark"/></svg><strong>PP</strong></span><button class="login-close" id="close-login" aria-label="返回开场">×</button></header>
        <div class="login-content"><div id="login-account-picker" class="login-account-picker" role="group" aria-label="选择账号"><button id="choose-current-account" type="button" data-login-account="current" aria-pressed="true"><img width="28" height="28" alt=""><span>忧郁小猫猫</span></button><button id="choose-old-account" type="button" data-login-account="legacy" aria-pressed="false" hidden><img width="28" height="28" alt=""><span>城南旧章</span></button><button id="choose-other-account" type="button" data-login-account="manual" aria-pressed="false">切换账号</button></div><div class="login-avatar"><img decoding="async" alt="忧郁小猫猫的头像"><span class="online-status" aria-label="在线"></span></div><h1 class="nickname">忧郁小猫猫</h1>
          <form id="login-form"><label class="field-label" for="pp-account">账号</label><div class="input-wrap"><span class="input-user" aria-hidden="true">◎</span><input id="pp-account" name="account" type="text" value="忧郁小猫猫" readonly aria-readonly="true" autocomplete="off" spellcheck="false"></div><label class="field-label" for="pp-password">密码</label><div class="input-wrap password-wrap"><svg class="icon"><use href="#lock"/></svg><input id="pp-password" name="passcode" type="password" inputmode="text" autocapitalize="none" spellcheck="false" value="leisongran0628" readonly aria-readonly="true" autocomplete="off"><svg class="icon fixed-lock" aria-label="密码已锁定"><use href="#lock"/></svg></div><div class="login-options"><span><svg class="checkbox-check"><use href="#check"/></svg>记住密码</span></div><p id="login-error" class="login-error" role="status" aria-live="polite"></p><button class="login-button" id="login-button" type="submit" aria-live="polite"><span id="login-button-text">登录</span><span class="login-spinner" hidden></span></button><p id="login-status" class="login-status" role="status" hidden>请稍候</p></form>
          <button type="button" class="notice-link" id="play-ending-music" hidden>播放片尾曲《诗歌都是胆小鬼》</button>
        </div>
      </div>
    </section>

    <section class="game-screen contacts-open" id="game-screen" aria-label="PP" hidden>
      <header class="game-titlebar"><span class="pp-logo"><svg class="pp-mark" aria-hidden="true"><use href="#pp-mark"/></svg><strong>PP</strong></span><div class="game-title-actions"><button type="button" class="achievement-entry" data-achievement-open>成就</button><button id="account-menu-toggle" class="account-menu-toggle" aria-label="账号菜单" aria-haspopup="menu" aria-controls="account-menu" aria-expanded="false"><img data-avatar="current" width="26" height="26" alt=""></button><button id="game-home" class="game-close" aria-label="返回开场">×</button></div><div id="account-menu" class="account-menu" role="menu" hidden><button id="account-menu-logout" role="menuitem">退出登录</button></div></header>
      <nav class="game-nav" aria-label="游戏板块">
        <div class="game-profile"><img decoding="async" data-avatar="current" alt="忧郁小猫猫"><span class="profile-online" aria-hidden="true"></span></div>
        <button class="module-button active" id="chat-module" aria-current="page"><svg class="icon"><use href="#chat"/></svg><span>聊天</span></button>
        <button class="module-button" id="blog-module"><svg class="icon"><use href="#blog"/></svg><span>博客</span></button>
        <button class="module-button" id="mail-module"><svg class="icon"><use href="#mail"/></svg><span>邮箱</span></button>
        <button class="module-button" id="album-module"><svg class="icon"><use href="#album"/></svg><span>相册</span></button>
        <button id="game-logout" class="logout-button" aria-label="退出登录"><svg class="icon"><use href="#logout"/></svg></button>
      </nav>
      <aside class="contacts-panel" aria-label="联系人">
        <div class="contacts-heading"><h1>聊天</h1><span>忧郁小猫猫</span></div>
        <label class="contacts-search"><svg class="icon"><use href="#search"/></svg><input id="contacts-search" type="search" aria-label="搜索联系人" placeholder="搜索联系人" autocomplete="off"></label>
        <div id="game-contact-list" class="game-contact-list"></div>
      </aside>
      <section class="chat-panel" aria-labelledby="chat-title">
        <header class="conversation-heading"><button id="show-contacts" class="show-contacts" aria-label="返回联系人"><svg class="icon"><use href="#back"/></svg></button><img decoding="async" id="conversation-avatar" class="contact-avatar" alt=""><h2 id="chat-title">王院长</h2><span class="history-label">聊天记录</span></header>
        <div class="conversation-tools"><label class="date-filter"><span>日期</span><select id="chat-date" aria-label="筛选聊天日期"></select></label><label class="message-search"><svg class="icon"><use href="#search"/></svg><input id="message-search" type="search" placeholder="搜索聊天记录" aria-label="搜索聊天记录" autocomplete="off"></label></div>
        <div id="conversation-history" class="conversation-history" tabindex="0" aria-label="聊天记录"></div>
      </section>
      <section class="album-panel" id="album-panel" aria-label="相册" hidden></section>
      <section class="blog-panel" id="blog-panel" aria-label="博客" hidden></section>
      <section class="mail-panel" id="mail-panel" aria-labelledby="mail-title" hidden>
        <header class="album-heading">
          <button class="album-back" id="mail-back" type="button" aria-label="返回收件箱" hidden><svg class="icon"><use href="#back"/></svg></button>
          <h1 id="mail-title">邮箱</h1>
        </header>
        <div class="mail-content" id="mail-inbox">
          <h2>收件箱</h2>
          <ul class="mail-list" id="mail-list"></ul>
        </div>
        <article class="mail-content mail-message" id="mail-message" aria-labelledby="mail-message-title" hidden>
          <h2 id="mail-message-title" tabindex="-1"></h2>
          <time id="mail-message-date"></time>
          <div class="mail-body"></div>
        </article>
      </section>
    </section>
  </main>
  <button type="button" id="hospital-mail-toast" class="hospital-mail-toast" hidden>
    <strong>忧郁小猫猫收到一封新邮件</strong>
    <span>【京城市儿童医院】您的密码已重置成功</span>
    <small>点击打开邮箱 ›</small>
  </button>

  <dialog id="notice-dialog" aria-labelledby="notice-title"><div class="notice-heading"><span id="notice-title">声明：</span><button id="close-notice" aria-label="关闭声明">×</button></div><div class="notice-body"><ol id="notice-list"></ol><label class="notice-confirmation"><input id="notice-read" type="checkbox"><span>我已阅读并确认声明</span></label><div class="notice-actions"><button class="primary-button" id="confirm-start" disabled>确认并开始游戏 <svg class="icon"><use href="#arrow"/></svg></button></div></div></dialog>
  <dialog id="album-access-dialog" aria-labelledby="album-access-title"><div class="notice-heading"><span id="album-access-title">光辉岁月</span><button id="close-album-access" aria-label="关闭相册访问问题">×</button></div><form id="album-access-form" class="album-access-body"><div class="album-lock-icon" aria-hidden="true"><svg class="icon"><use href="#lock"/></svg></div><p id="album-description" class="album-description"></p><label class="album-question" for="album-answer">访问问题：<span id="album-question"></span></label><input id="album-answer" class="album-answer" type="text" inputmode="text" autocapitalize="none" spellcheck="false" aria-label="访问答案" aria-describedby="album-answer-error" placeholder="输入答案" autocomplete="off" required><p id="album-answer-error" class="album-answer-error" role="status" aria-live="polite"></p><div class="album-access-actions"><button type="button" class="album-secondary-button" id="cancel-album-access">取消</button><button class="primary-button" type="submit">确认</button></div></form></dialog>
  <dialog id="restart-dialog" aria-labelledby="restart-title" aria-describedby="restart-message">
    <div class="notice-heading"><strong id="restart-title">重新开始</strong></div>
    <form method="dialog" class="notice-body">
      <p id="restart-message">这会清除游玩进度、档案已读和账号记录，并回到游戏开场。已解锁的成就会保留。</p>
      <p id="restart-error" role="status"></p>
      <div class="notice-actions">
        <button class="album-secondary-button" autofocus>取消</button>
        <button class="primary-button" id="confirm-restart" type="button">确认重新开始</button>
      </div>
    </form>
  </dialog>
  <dialog id="legacy-login-dialog" aria-labelledby="legacy-login-title" aria-describedby="legacy-login-message">
    <div class="notice-heading"><strong id="legacy-login-title">账号验证成功</strong></div>
    <form method="dialog" class="notice-body">
      <p id="legacy-login-message">你尚未查明雷淞然当年主动拒绝收养的真正原因。请继续调查。</p>
      <div class="notice-actions"><button class="primary-button" autofocus>返回</button></div>
    </form>
  </dialog>
  <noscript><p class="noscript">请在浏览器中启用 JavaScript，以开始《秋叶孤儿院调查录》。</p></noscript>
